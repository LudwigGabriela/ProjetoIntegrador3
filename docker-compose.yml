services:
  db:
    image: postgres:18
    container_name: vettrace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vettrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vettrace}
      POSTGRES_DB: ${POSTGRES_DB:-vettrace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vettrace-data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vettrace}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vettrace-data: